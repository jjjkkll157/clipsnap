<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClipSnap</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:360px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:#1a1a2e; color:#e0e0e0; }
  .header { background: linear-gradient(135deg, #667eea, #764ba2); padding:16px; text-align:center; }
  .header h1 { font-size:20px; color:#fff; }
  .header p { font-size:11px; color:rgba(255,255,255,.7); margin-top:4px; }
  .content { padding:16px; }
  .btn { width:100%; padding:12px; border:none; border-radius:8px; font-size:14px; cursor:pointer; font-weight:600; transition:all .2s; }
  .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color:#fff; }
  .btn-primary:hover { opacity:.9; transform:translateY(-1px); }
  .btn-secondary { background:#2a2a3e; color:#e0e0e0; margin-top:8px; }
  .btn-secondary:hover { background:#3a3a4e; }
  .tags { display:flex; gap:6px; margin:10px 0; flex-wrap:wrap; }
  .tag { background:#2a2a3e; padding:4px 10px; border-radius:12px; font-size:11px; cursor:pointer; }
  .tag.active { background:#667eea; color:#fff; }
  .input-tag { flex:1; min-width:80px; background:transparent; border:1px solid #3a3a4e; border-radius:12px; padding:4px 10px; font-size:11px; color:#e0e0e0; }
  .status { margin-top:12px; padding:10px; border-radius:8px; font-size:12px; display:none; }
  .status.success { background:#0f3460; color:#4ecca3; display:block; }
  .status.error { background:#3a0a0a; color:#ff6b6b; display:block; }
  .status.loading { background:#1a1a3e; color:#667eea; display:block; }
  .preview { margin-top:12px; max-height:200px; overflow-y:auto; background:#0d0d1a; border-radius:8px; padding:10px; font-size:11px; font-family:monospace; white-space:pre-wrap; word-break:break-all; display:none; }
  .footer { text-align:center; padding:8px; font-size:10px; color:#555; border-top:1px solid #2a2a3e; }
  .footer a { color:#667eea; text-decoration:none; }
  .api-status { font-size:10px; padding:4px 8px; border-radius:4px; margin-top:8px; }
  .api-status.online { background:#0f3460; color:#4ecca3; }
  .api-status.offline { background:#3a0a0a; color:#ff6b6b; }
</style>
</head>
<body>
<div class="header">
  <h1>🖇️ ClipSnap</h1>
  <p>一键收藏网页为 Markdown</p>
</div>
<div class="content">
  <div class="tags" id="tagList">
    <span class="tag active" data-tag="">全部</span>
    <span class="tag" data-tag="技术">技术</span>
    <span class="tag" data-tag="阅读">阅读</span>
    <span class="tag" data-tag="AI">AI</span>
    <span class="tag" data-tag="工具">工具</span>
    <input class="input-tag" id="customTag" placeholder="自定义标签" maxlength="10">
  </div>
  <button class="btn btn-primary" id="btnClip">📥 抓取当前网页</button>
  <button class="btn btn-secondary" id="btnOpenDashboard">📋 打开管理面板</button>
  <div class="status" id="status"></div>
  <div class="preview" id="preview"></div>
  <div class="api-status offline" id="apiStatus">🔴 API 未连接</div>
</div>
<div class="footer">
  ClipSnap v1.0 · <a href="http://localhost:8710" target="_blank">管理面板</a>
</div>
<script src="popup.js"></script>
</body>
</html>
